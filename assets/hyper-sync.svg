<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- hyper-sync: a monitor with the LED strip's glow behind it (right, top and left, like the
       Skydimo U). Render: magick -density 384 -background none hyper-sync.svg -resize 256x256 hyper-sync.png -->
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="0.35" stop-color="#ff2d78"/>
      <stop offset="0.65" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242b3b"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- light thrown on the wall, then the strip itself -->
  <path d="M34 196 V66 Q34 36 64 36 H192 Q222 36 222 66 V196" fill="none" stroke="url(#strip)"
        stroke-width="34" stroke-linecap="round" filter="url(#glow)" opacity="0.95"/>
  <path d="M40 176 V60 Q40 44 56 44 H200 Q216 44 216 60 V176" fill="none" stroke="url(#strip)"
        stroke-width="9" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M40 176 V60 Q40 44 56 44 H200 Q216 44 216 60 V176" fill="none" stroke="#ffffff"
        stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- stand -->
  <path d="M114 160 H142 L149 194 H107 Z" fill="#2c3341"/>
  <rect x="84" y="190" width="88" height="13" rx="6.5" fill="#3a4253"/>

  <!-- monitor -->
  <rect x="48" y="52" width="160" height="112" rx="15" fill="#11141b" stroke="#3d4659" stroke-width="3"/>
  <rect x="58" y="62" width="140" height="92" rx="8" fill="url(#screen)"/>
  <path d="M58 70 Q58 62 66 62 H150 L92 154 H66 Q58 154 58 146 Z" fill="#ffffff" opacity="0.05"/>
</svg>
